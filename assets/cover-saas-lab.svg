    <text x="20" y="68" fill="#E6EDF3" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5">• Fila persistente SQLite WAL (14 tabelas)</text>
    <text x="20" y="98" fill="#E6EDF3" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5">• Workers com locks, heartbeat &amp; recovery</text>
    <text x="20" y="128" fill="#E6EDF3" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5">• LiveAgentStream &amp; Kanban 6 colunas</text>
