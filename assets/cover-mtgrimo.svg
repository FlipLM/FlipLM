<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="MTGrimo — Motor Autoral de Busca por Cartas e NLP Determinístico PT-BR">
  <rect width="800" height="450" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="48" y="60" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="1.4">MOTOR AUTORAL DE BUSCA &amp; NLP DETERMINÍSTICO</text>
  <text x="48" y="102" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" font-weight="700">MTGrimo — Plataforma MTG</text>
  <text x="48" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">Catálogo de 118.000+ cartas · Conversão PT-BR para consulta estruturada</text>

  <!-- Query Box -->
  <rect x="48" y="158" width="704" height="48" rx="9" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
  <text x="68" y="187" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">&gt; "criatura verde que gera mana custo até 2"</text>

  <!-- 3 Pipeline Boxes -->
  <g transform="translate(48, 228)">
    <rect width="220" height="104" rx="10" fill="#132238" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="16" y="30" fill="#F59E0B" font-family="ui-monospace, Consolas, monospace" font-size="11.5" font-weight="700">1. PARSER PT-BR</text>
    <text x="16" y="58" fill="#E2E8F0" font-family="ui-monospace, Consolas, monospace" font-size="13">t:creature c:g cmc&lt;=2</text>
    <text x="16" y="82" fill="#94A3B8" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="13">Sem LLM · 100% determinístico</text>
  </g>
  <g transform="translate(290, 228)">
    <rect width="220" height="104" rx="10" fill="#132238" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="16" y="30" fill="#F59E0B" font-family="ui-monospace, Consolas, monospace" font-size="11.5" font-weight="700">2. INDEXAÇÃO SQL</text>
    <text x="16" y="58" fill="#E2E8F0" font-family="ui-monospace, Consolas, monospace" font-size="13">pg_trgm · GIN · FTS</text>
    <text x="16" y="82" fill="#94A3B8" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="13">118k+ cartas · 123k+ faces</text>
  </g>
  <g transform="translate(532, 228)">
    <rect width="220" height="104" rx="10" fill="#132238" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="16" y="30" fill="#F59E0B" font-family="ui-monospace, Consolas, monospace" font-size="11.5" font-weight="700">3. APIS &amp; BASES</text>
    <text x="16" y="58" fill="#E2E8F0" font-family="ui-monospace, Consolas, monospace" font-size="13">Scryfall · EDHREC</text>
    <text x="16" y="82" fill="#94A3B8" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="13">LigaMagic BRL + cache Redis</text>
  </g>

  <rect x="48" y="358" width="704" height="44" rx="9" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
  <text x="68" y="385" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">Rust (Axum/Tokio) · PostgreSQL 16 · Redis 7 · React 19 · React Native Expo</text>
</svg>
