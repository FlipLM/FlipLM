<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 142" width="860" height="142" role="img" aria-label="Conexão de Experiência: Suporte e Infra, Análise de Sistemas, BI e Automação, Engenharia Full Stack">
  <rect width="860" height="142" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>

  <!-- Card 01 -->
  <g transform="translate(16, 16)">
    <rect width="190" height="110" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
    <text x="14" y="28" fill="#A3CC63" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700">01 · BASE OPERACIONAL</text>
    <text x="14" y="54" fill="#F0F6FC" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="700">Suporte N1/N2 &amp; Infra</text>
    <text x="14" y="76" fill="#8B949E" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="12">Redes, VoIP, diagnóstico,</text>
    <text x="14" y="94" fill="#8B949E" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="12">domínios e servidores.</text>
  </g>
  <text x="211" y="77" fill="#6E7681" font-family="Arial, sans-serif" font-size="16" font-weight="700">→</text>

  <!-- Card 02 -->
  <g transform="translate(229, 16)">
    <rect width="190" height="110" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
    <text x="14" y="28" fill="#A3CC63" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700">02 · NEGÓCIO &amp; QUALIDADE</text>
    <text x="14" y="54" fill="#F0F6FC" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="700">Análise de Sistemas</text>
    <text x="14" y="76" fill="#8B949E" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="12">Requisitos, documentação</text>
    <text x="14" y="94" fill="#8B949E" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="12">técnica e homologação.</text>
  </g>
  <text x="424" y="77" fill="#6E7681" font-family="Arial, sans-serif" font-size="16" font-weight="700">→</text>

  <!-- Card 03 -->
  <g transform="translate(442, 16)">
    <rect width="190" height="110" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
    <text x="14" y="28" fill="#A3CC63" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700">03 · DADOS &amp; EFICIÊNCIA</text>
    <text x="14" y="54" fill="#F0F6FC" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="700">BI &amp; Automação</text>
    <text x="14" y="76" fill="#8B949E" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="12">Power BI, Power Apps,</text>
    <text x="14" y="94" fill="#8B949E" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="12">Power Automate e fluxos.</text>
  </g>
  <text x="637" y="77" fill="#6E7681" font-family="Arial, sans-serif" font-size="16" font-weight="700">→</text>

  <!-- Card 04 (Highlight) -->
  <g transform="translate(655, 16)">
    <rect width="189" height="110" rx="10" fill="#1E2612" stroke="#A3CC63" stroke-width="1.4"/>
    <text x="14" y="28" fill="#A3CC63" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700">04 · PRODUTO END-TO-END</text>
    <text x="14" y="54" fill="#F7F9F5" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="700">Engenharia Full Stack</text>
    <text x="14" y="76" fill="#C9D6B6" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="12">SaaS, APIs, segurança,</text>
    <text x="14" y="94" fill="#C9D6B6" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="12">Docker e produção.</text>
  </g>
</svg>
